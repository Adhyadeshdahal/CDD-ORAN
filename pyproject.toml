[project]
name = "cdd-oran"
version = "0.1.0"
description = "Causal Discovery-Driven Model-Based Planning for xApp Conflict Mitigation in O-RAN"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.10.0,<2.11",
    "numpy==2.4.2",   # exact: E6 trajectories are chaotic; see scratchpad/e6_dev/cloud.py docstring
    "gymnasium>=1.2.3",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "tensorboard>=2.18",
    "pyyaml>=6.0.3",
    "causal-learn>=0.1.4.8",
]

[tool.uv]
# Not yet an installable distribution; imports resolve from the working directory.
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
baselines = [
    "scikit-learn>=1.9.1",
    "scipy==1.18.1",  # exact: the E6 sim uses scipy (gaussian_filter, norm.cdf)
    "shap>=0.52.0",
    "xgboost>=3.4.1",
]
citests = [
    "dcor>=0.7",
    "momentchi2==0.1.8",
    "tigramite>=5.2.10.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length -- the formatter owns this
]

[tool.ty.environment]
python-version = "3.12"
