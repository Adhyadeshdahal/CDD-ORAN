seed: 45
mitigation_seed: 0
environment: EnvironmentII
model_kind: cdl
param_ranges: train
evaluation_param_ranges: ood
num_steps: 30
device: auto
deterministic: false
model:
  lr: 0.001
  cmi_threshold: 0.2
  eval_tau: 0.99
  grad_clip: 10.0
  generative_fc_dims: [64, 64]
  feature_fc_dims: [64, 64]
  batch_size: 128
  # --- structure-conditioned dynamics ---
  residual_bound: 0.25
  residual_l2: 0.01
  residual_l1: 0.001
  residual_hidden: [64, 64]
  residual_alert_fraction: 0.25
  # REQUIRED offline artifacts, produced by `cdd_oran.cli discover`.
  posterior_artifact: artifacts/EnvironmentII_posterior.json
  enumeration_graph: artifacts/EnvironmentII_enum.json
  # Robust-planning ensemble size (1 = single-model prediction).
  predict_members: 8
train:
  total_steps: 50000
  init_steps: 4000
  inference_gradient_steps: 1
  eval_steps: 10
  plot_freq: 500
  test_batch_size: 10
planner:
  n_horizon: 1
  risk_kappa: 0.0
  # Robust return aggregation over the predict_members ensemble.
  ensemble_aggregator: quantile
  ensemble_quantile: 0.9
  ensemble_kappa: null
  disagreement_penalty: 0.0
  ood_threshold: null
  cem:
    n_candidate: 256
    n_top: 128
    n_iter: 20
  mppi:
    n_samples: 2000
    temperature: 0.6
    noise_sigma: 0.1
  mcts:
    n_simulations: 3000
    ucb_c: 1.5
