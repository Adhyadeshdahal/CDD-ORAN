# Env I structure-conditioned CDL (the sole world model).
# Two PRECOMPUTED OFFLINE ARTIFACTS are LOADED at train/eval time (no online bootstrap, no
# global RNG mutation): posterior_artifact (the held-out-CALIBRATED P1 posterior) and
# enumeration_graph (the frozen crisp graph for conflict enumeration). Both are PRODUCED by the
# decoupled discovery stage, which runs from scratch (no pre-existing hard-mask run needed).
# predict_members>1 turns on the robust-planning ensemble.
#
# Documented command chain (Env I):
#   1. discover:  uv run python -m cdd_oran.cli discover --config configs/env_i_cdl.yaml
#                   -> artifacts/EnvironmentI_posterior.json, artifacts/EnvironmentI_enum.json
#   2. train:     uv run python -m cdd_oran.cli train --config configs/env_i_cdl.yaml
#   3. evaluate:  uv run python -m cdd_oran.cli evaluate --run runs/EnvironmentI/cdl/<run_id>
# The two paths below already point at the discovery outputs, so train/evaluate need no --set.
#
# Env II/III/IV: run the same chain with configs/env_ii|iii|iv_cdl.yaml and set the matching
# posterior_artifact/enumeration_graph (artifacts/EnvironmentII_*.json, etc.). Discovery writes
# them under <env>_posterior.json / <env>_enum.json automatically from cfg.environment.
seed: 45
mitigation_seed: 0
environment: EnvironmentI
model_kind: cdl
param_ranges: train
evaluation_param_ranges: ood
num_steps: 30
device: auto
deterministic: false
model:
  lr: 0.001
  cmi_threshold: 0.16
  eval_tau: 0.99
  grad_clip: 10.0
  generative_fc_dims: [64, 64]
  feature_fc_dims: [64, 64]
  batch_size: 128
  # --- structure-conditioned dynamics ---
  # Attribution ablation knobs (see .temp/new_arch/reports/attribution_infra_handoff.md):
  structure_source: discovered  # discovered (default) | oracle (env.true_adj_matrix)
  residual_enabled: true        # bounded dense residual ON/OFF (OFF = exact zero)
  residual_bound: 0.25
  residual_l2: 0.01
  residual_l1: 0.001
  residual_hidden: [64, 64]
  residual_alert_fraction: 0.25
  # REQUIRED offline artifacts, produced by `cdd_oran.cli discover` (step 1 above):
  posterior_artifact: artifacts/EnvironmentI_posterior.json  # calibrated P1 posterior (GraphPosterior.save)
  enumeration_graph: artifacts/EnvironmentI_enum.json        # frozen crisp enumeration graph (freeze_enumeration_graph)
  # Robust-planning ensemble size (1 = single-model prediction).
  predict_members: 8
train:
  total_steps: 20000
  init_steps: 4000
  inference_gradient_steps: 1
  eval_steps: 10
  plot_freq: 500
  test_batch_size: 10
planner:
  n_horizon: 1
  risk_kappa: 0.0
  # Robust return aggregation over the predict_members ensemble.
  ensemble_aggregator: quantile   # mean | quantile (risk-averse, default) | kappa
  ensemble_quantile: 0.9          # upper cost quantile for "quantile"
  ensemble_kappa: null            # for "kappa"; null reuses risk_kappa
  disagreement_penalty: 0.0       # optional additive OOD penalty (0 = off, still reported)
  utility_weight: 0.0             # signed standardized-utility reward in the per-member cost (0 = off)
  ood_threshold: null             # disagreement OOD warning threshold (null = off)
  cem:
    n_candidate: 256
    n_top: 128
    n_iter: 20
  mppi:
    n_samples: 2000
    temperature: 0.6
    noise_sigma: 0.1
  mcts:
    n_simulations: 3000
    ucb_c: 1.5
